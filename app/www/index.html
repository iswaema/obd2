<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0F14" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F3F5F8" media="(prefers-color-scheme: light)">
<title>OBD Scanner</title>
<link href="fonts/fonts.css" rel="stylesheet">
<script src="native-shim.js"></script>
<style>:root{--bg:#0B0F14;--card:#141B23;--hi:#1B2530;--bd:#24303D;--tx:#E8EEF4;--dim:#8A99A8;--ac:#3DD68C;--amber:#F5B74A;--red:#F07A5F;--blue:#5AB0F0;--bad:#FF6B5E;--sub:#B5C2CE;--blue-tx:#7CC0F2;--ok-soft:#1F5E42;--warn-bd:#4A3A1A;--grab:#3A4756;--bad-bg:#231413;--warn-bg:#1E1A12;--bad-tx:#F3D2CE;--bad-sub:#F3B3AC;--big-tx:#F2F6FA;--grey-tx:#C8D2DC;--norm:#9FB0BF;--bad-chip-bd:#6A2C27;--warn-soft:#3A2E14;--bad-chip:#2E1816;--amber-bg:#2A2213;--on-red:#1A0905;--on-bad:#1A0503;--blue-bg:#13222F;--ok-bg:#11201A;--gauge-bg:#0E141A;--on-ac:#06140D;--log-bg:#05080B;--scrim:rgba(3,6,9,.72);--tick-off:#1E2832;--tick-offred:#3E201D;--arc-bg:#18212B;color-scheme:dark}
html[data-theme="light"]{--bg:#F3F5F8;--card:#FFFFFF;--hi:#EDF1F5;--bd:#D6DDE4;--tx:#111820;--dim:#55636F;--ac:#0E7A50;--amber:#8A5300;--red:#C23B2A;--blue:#1D74C4;--bad:#C8321F;--sub:#43505C;--blue-tx:#1A66AD;--ok-soft:#C9EBDA;--warn-bd:#EDC98A;--grab:#C2CAD2;--bad-bg:#FDEDEB;--warn-bg:#FFF6E5;--bad-tx:#7C2B21;--bad-sub:#9E3426;--big-tx:#0C131A;--grey-tx:#3B4752;--norm:#56636F;--bad-chip-bd:#EFB4AC;--warn-soft:#FBE2B4;--bad-chip:#FFF7F6;--amber-bg:#FFF0D4;--on-red:#FFFFFF;--on-bad:#FFFFFF;--blue-bg:#E2EFFB;--ok-bg:#E8F7EF;--gauge-bg:#FFFFFF;--on-ac:#FFFFFF;--log-bg:#F8FAFC;--scrim:rgba(17,24,32,.42);--tick-off:#DCE3EA;--tick-offred:#F4D3CD;--arc-bg:#E4E9EE;color-scheme:light}
@media (prefers-color-scheme: light){html[data-theme="auto"]{--bg:#F3F5F8;--card:#FFFFFF;--hi:#EDF1F5;--bd:#D6DDE4;--tx:#111820;--dim:#55636F;--ac:#0E7A50;--amber:#8A5300;--red:#C23B2A;--blue:#1D74C4;--bad:#C8321F;--sub:#43505C;--blue-tx:#1A66AD;--ok-soft:#C9EBDA;--warn-bd:#EDC98A;--grab:#C2CAD2;--bad-bg:#FDEDEB;--warn-bg:#FFF6E5;--bad-tx:#7C2B21;--bad-sub:#9E3426;--big-tx:#0C131A;--grey-tx:#3B4752;--norm:#56636F;--bad-chip-bd:#EFB4AC;--warn-soft:#FBE2B4;--bad-chip:#FFF7F6;--amber-bg:#FFF0D4;--on-red:#FFFFFF;--on-bad:#FFFFFF;--blue-bg:#E2EFFB;--ok-bg:#E8F7EF;--gauge-bg:#FFFFFF;--on-ac:#FFFFFF;--log-bg:#F8FAFC;--scrim:rgba(17,24,32,.42);--tick-off:#DCE3EA;--tick-offred:#F4D3CD;--arc-bg:#E4E9EE;color-scheme:light}}
.tile,.card,.btn,.tab,.gauge,.banner,.opt,.chip,.pill,.input{transition:background-color .2s,border-color .2s,color .2s}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:4px;border-radius:14px;background:var(--hi);border:1px solid var(--bd)}
.seg button{min-height:44px;border:0;border-radius:10px;background:transparent;color:var(--dim);font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.apphead{display:flex;flex-direction:column;gap:8px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit}
#app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.screen{flex:1;display:flex;flex-direction:column;gap:14px;padding:calc(24px + env(safe-area-inset-top)) 18px 110px}
.head{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:44px}
h1{margin:0;font-size:28px;font-weight:700;letter-spacing:-.5px}
.dim{color:var(--dim);font-size:13px;line-height:18px}
.center{text-align:center}
p{margin:0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px}
.row{display:flex;align-items:center}.sb{justify-content:space-between}.g10{gap:10px}
.kv{padding:6px 0;gap:12px}.kv span:last-child{text-align:right}
.btn{flex:1;height:50px;border:0;border-radius:14px;background:var(--ac);color:var(--on-ac);font-size:15px;font-weight:700;cursor:pointer;padding:0 18px}
.btn:disabled{opacity:.45}
.danger-ghost{background:transparent;border:1.5px solid var(--red);color:var(--red)}
.pill{height:44px;padding:0 16px;border-radius:22px;background:var(--card);border:1px solid var(--bd);font-size:13px;font-weight:600;cursor:pointer}
.link{background:none;border:0;color:var(--red);font-weight:600;cursor:pointer;min-height:44px}
.opt{display:flex;align-items:center;gap:14px;text-align:left;cursor:pointer;width:100%;min-height:72px}
.opt:disabled{opacity:.5;cursor:default}
.opt:not(:disabled):active{border-color:var(--ac)}
.oi{width:44px;height:44px;border-radius:12px;background:var(--ok-soft);color:var(--ac);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.opt:disabled .oi{background:var(--hi);color:var(--dim)}
.ot{display:flex;flex-direction:column;gap:3px}.ot b{font-size:16px}
.errcard{border-color:var(--red);display:flex;flex-direction:column;gap:4px}.errcard b{color:var(--red)}
.err{color:var(--red);font-size:14px}
.spin{width:20px;height:20px;border-radius:50%;border:2.5px solid var(--bd);border-top-color:var(--ac);animation:sp 1s linear infinite;flex:0 0 auto}
@keyframes sp{to{transform:rotate(360deg)}}
/* gauge */
.gauge-wrap{display:flex;justify-content:center}
.gauge{position:relative;width:340px;height:340px;border-radius:50%;background:var(--gauge-bg);box-shadow:inset 0 0 0 1px var(--hi);flex:0 0 auto}
.gauge svg{position:absolute;inset:0}
.g-num{position:absolute;transform:translate(-50%,-50%);font-family:Orbitron,Inter,sans-serif;font-size:13px;font-weight:600;color:var(--dim)}
.g-num.red{color:var(--red)}
.g-center{position:absolute;left:170px;top:172px;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px}
.g-speed{font-family:Orbitron,Inter,sans-serif;font-size:72px;line-height:76px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-1px;color:var(--big-tx)}
.g-unit{font-size:13px;font-weight:600;letter-spacing:1.5px;color:var(--blue-tx)}
.g-div{width:96px;height:1px;background:var(--bd);margin:10px 0 8px}
.g-rpmrow{display:flex;align-items:baseline;gap:6px}
.g-rpm{font-family:Orbitron,Inter,sans-serif;font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.g-rpml{font-size:12px;font-weight:600;letter-spacing:1px;color:var(--dim)}
.g-bottom{position:absolute;left:170px;top:300px;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:4px}
.g-x{font-size:10px;font-weight:600;letter-spacing:1.5px;color:var(--dim)}
.g-trip{font-family:Orbitron,Inter,sans-serif;font-size:12px;font-weight:600;letter-spacing:1.5px;color:var(--sub);padding:4px 10px;border-radius:6px;background:var(--card);border:1px solid var(--bd);white-space:nowrap}
.legend{display:flex;justify-content:center;gap:16px;font-size:12px;color:var(--dim);flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:6px}.legend i{width:14px;height:4px;border-radius:2px;display:inline-block}
.mini3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.mini{display:flex;flex-direction:column;gap:4px;padding:12px;text-align:left;cursor:default}
button.mini{cursor:pointer}
.digi{font-family:Orbitron,Inter,sans-serif;font-size:20px;font-weight:700}
.digi small{font-family:Inter,sans-serif;font-size:12px;font-weight:500;color:var(--dim)}
/* tiles */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{display:flex;flex-direction:column;gap:6px}
.tv{display:flex;align-items:baseline;gap:4px}.tv b{font-size:26px;font-variant-numeric:tabular-nums}.tv small{color:var(--dim);font-size:12px}
.bar{height:4px;border-radius:2px;background:var(--bd);overflow:hidden}.bar div{height:4px;width:0;background:var(--ac);transition:width .25s}
.mm{font-size:11px;color:var(--dim)}
.tile.txt{justify-content:space-between}
.th{display:flex;justify-content:space-between;align-items:center;gap:6px}
.badge:empty{display:none}.badge{font-size:10px;font-weight:800;letter-spacing:.5px;color:var(--on-bad);background:var(--bad);padding:2px 6px;border-radius:6px}
.norm{font-size:11px;line-height:15px;color:var(--norm)}.norm:empty{display:none}
.tile.bad,.mini.bad{border-color:var(--bad);background:var(--bad-bg)}.tile.bad b,.mini.bad b,.tile.bad .tv b{color:var(--bad)}.tile.bad .norm{color:var(--bad-sub)}
.oor{display:flex;flex-direction:column;gap:4px;border-color:var(--bad);background:var(--bad-bg)}.oor b{display:flex;align-items:center;gap:8px;color:var(--bad);font-size:15px}.oorl{display:flex;flex-wrap:wrap;gap:6px}.oorl button{min-height:36px;padding:6px 10px;border-radius:10px;border:1px solid var(--bad-chip-bd);background:var(--bad-chip);color:var(--bad-tx);font-size:13px;cursor:pointer;text-align:left}
.oor[hidden]{display:none}.tt{font-size:15px;line-height:20px;font-weight:600}
.tab-live .sec{margin-top:10px}
/* codes */
.status{display:flex;align-items:center;gap:14px}.status>div:last-child{display:flex;flex-direction:column;gap:2px}.status b{font-size:17px}
.status span{font-size:13px;color:var(--sub)}
.si{width:52px;height:52px;border-radius:26px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.status.ok{background:var(--ok-bg);border-color:var(--ok-soft)}.status.ok b{color:var(--ac)}.status.ok .si{background:var(--ok-soft);color:var(--ac)}
.status.warn{background:var(--warn-bg);border-color:var(--warn-bd)}.status.warn b{color:var(--amber)}.status.warn .si{background:var(--warn-soft);color:var(--amber)}
.sec{margin:6px 0 0;font-size:13px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--dim)}
.code{display:flex;flex-direction:column;gap:8px}.code p{font-size:15px;line-height:21px}.code[data-dtc]{cursor:pointer}.code[data-dtc]:active{opacity:.7}a.btn{display:flex;align-items:center;justify-content:center;text-decoration:none;box-sizing:border-box}
.dtc{font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:700;padding:4px 10px;border-radius:8px}
.dtc.amber{color:var(--amber);background:var(--amber-bg)}.dtc.blue{color:var(--blue-tx);background:var(--blue-bg)}.dtc.grey{color:var(--grey-tx);background:var(--hi)}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
/* terminal */
.tab-terminal{padding-bottom:100px}
.log{flex:1;min-height:280px;max-height:calc(100dvh - 330px);overflow-y:auto;background:var(--log-bg);border:1px solid var(--bd);border-radius:16px;padding:12px;font-size:12.5px;line-height:19px;white-space:pre-wrap;word-break:break-all}
.l-tx{color:var(--blue-tx)}.l-rx{color:var(--tx)}.l-info{color:var(--dim)}.l-err{color:var(--red)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.chip{flex:0 0 auto;height:44px;padding:0 14px;border-radius:22px;background:var(--card);border:1px solid var(--bd);font-size:13px;font-weight:600;cursor:pointer}
.chip:disabled{opacity:.4}
.input{flex:1;min-width:0;height:50px;padding:0 14px;border-radius:14px;background:var(--hi);border:1px solid var(--bd);color:var(--tx);font-size:16px;text-transform:uppercase}
.input::placeholder{text-transform:none;color:var(--dim)}
.input:focus{outline:2px solid var(--ac);outline-offset:-1px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.empty{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:12px;padding:40px 10px}.empty .btn{flex:0 0 auto;width:100%}
/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:var(--card);border-top:1px solid var(--bd);padding:6px 6px calc(8px + env(safe-area-inset-bottom))}
.tabs .tab{position:relative;flex:1;max-width:96px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;min-height:52px;background:none;border:0;color:var(--dim);font-size:11px;font-weight:500;cursor:pointer}
.tabs .tab.on{color:var(--ac);font-weight:700}
.dot{position:absolute;top:5px;right:calc(50% - 18px);width:8px;height:8px;border-radius:4px;background:var(--grab)}
.dot.connected{background:var(--ac)}.dot.connecting,.dot.reconnecting{background:var(--amber)}
.banner{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:14px;background:var(--warn-bg);border:1px solid var(--warn-bd);color:var(--amber);font-size:14px;font-weight:600}.banner .link{color:var(--amber)}
.sheet-bg{position:fixed;inset:0;background:var(--scrim);display:flex;flex-direction:column;justify-content:flex-end;z-index:10}
.sheet{max-width:480px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding:22px 20px calc(30px + env(safe-area-inset-bottom));border-radius:24px 24px 0 0;background:var(--card);border-top:1px solid var(--bd)}
.sheet h2{margin:0;font-size:20px}.sheet p{font-size:14px;line-height:21px;color:var(--sub)}.sheet .btn{flex:0 0 auto}
.grab{width:40px;height:4px;border-radius:2px;background:var(--grab);align-self:center}
.amberText{color:var(--amber)!important}.dangerSolid{background:var(--red);color:var(--on-red)}.ghost{background:transparent;border:1px solid var(--bd);color:var(--tx)}
.diag summary{display:flex;justify-content:space-between;align-items:center;cursor:pointer;min-height:28px;list-style:none}.diag summary::-webkit-details-marker{display:none}
.diag[open] summary{margin-bottom:6px}.okc{color:var(--ac);font-size:13px}.badc{color:var(--amber);font-size:13px}
.advice{margin-top:8px;font-size:14px;line-height:20px;color:var(--tx)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
@media (max-width:370px){.gauge{transform:scale(.88);margin:-20px}}
</style>
</head>
